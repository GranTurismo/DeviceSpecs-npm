name: Publish NPM Package

# Publishes with npm trusted publishing (OIDC): no token, no one-time password.
# One-time setup on npmjs.com -> package @granturismo/devicespecs -> Settings -> Trusted Publisher:
#   GitHub Actions, organization/user "GranTurismo", repository "DeviceSpecs-npm", workflow "publish.yml".
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (trusted publishing needs npm 11.5.1+)
        run: npm install -g npm@latest && npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public
